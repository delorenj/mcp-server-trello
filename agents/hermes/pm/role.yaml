# Hermes agent role manifest — minimal install for the momo/tp board adapter.
repo: mcp-server-trello
role: pm
agent_id: mcp-server-trello-pm
display_name: "MCP Server Trello PM"
purpose: "pm role scaffold for board adapter (momo/tp) access"

ticket_provider:
  type: plane
  workspace: "33god"
  identifier: "MCPS"
  # Normalized-state -> Plane lane names. REQUIRED, not optional: the
  # adapter refuses to guess when a Plane state group holds more than one
  # lane, so every band must be named or the transition fails.
  backlog:   "Backlog"
  unstarted: "Todo"
  started:   "In Progress"
  in_review: "E2E Testing & QA"
  completed: "Done"
  cancelled: "Cancelled"
